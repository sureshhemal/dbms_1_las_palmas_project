name: reseed

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  reseed:
    name: Reseed the production database
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key and known hosts
        env:
          RESEED_SSH_KEY: ${{ secrets.RESEED_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$RESEED_SSH_KEY" > ~/.ssh/reseed_key
          chmod 600 ~/.ssh/reseed_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run migrate:fresh --seed on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/reseed_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /var/www/las_palmas
          php artisan down --retry=60 --refresh=15
          trap 'php artisan up' EXIT
          php artisan migrate:fresh --seed --force
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/reseed_key
